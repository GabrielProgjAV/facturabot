# Verificación automática: corre en cada Pull Request y en cada cambio que llega a main.
# Si algo falla, el PR queda en rojo y no se puede integrar (main está protegida).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    # No cambiar el nombre: la protección de main exige este check por su nombre.
    name: api (lint, tipos, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # PostgreSQL desechable para las pruebas de integración (pnpm test:int). Credenciales solo
    # de CI: el contenedor vive lo que dura el job y no guarda datos reales.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # La usan el CLI de Prisma y las pruebas de integración. Los tests unitarios no se conectan.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm exec prettier --check src test
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: pnpm test
      # Aplica las migraciones existentes, sin generar nuevas ni pedir confirmación. Si falla,
      # el job falla antes de las pruebas de integración.
      - run: pnpm exec prisma migrate deploy
      - run: pnpm test:int
